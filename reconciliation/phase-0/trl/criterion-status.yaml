# The five March 2026 gates (gates-proposal.yaml `retired`), each with what replaces it
retired_gates:
  gate-1:
    replaced_by: [kdp-0b, 0a-mtr]
    reason: >-
      A 100 g ISS experiment cannot retire the metallurgy risk (scale gap 4–6 orders of magnitude), and whether
      gravity is needed at all is contested. Metallurgy is now judged per route: route evidence at the 0A mid-term
      review (mtr-metallurgy) and one complete route at TRL 6 for KDP-0B (kdp-0b-route). Solar-grade Si is deferred.
  gate-2:
    replaced_by: [0a-mtr]
    reason: >-
      The cryogenic depot was removed from Phase 0 (round-2 §2); the cryocooler, sunshield and MLI rows move to
      Phase 1. Tug propellant is selected at the 0A mid-term review (mtr-propellant) under D-05.
  gate-3:
    replaced_by: [g-water-pilot, kdp-0b]
    reason: >-
      Water extraction is a pilot only if the target is C-type (D-05); industrial electrolysis is deferred to 0B.
  gate-4:
    replaced_by: [g-target]
    reason: >-
      Target selection now requires sampled recoverable Fe-Ni grade, not a remote survey, and comes after the scouts
      return data.
  gate-5:
    replaced_by: [kdp-0b, 0a-mtr]
    reason: >-
      D-02 replaces the month-60 PDR with KDP-0B, the one-way decision (TRL 6 in a relevant environment, no waivers,
      for project-ending technologies), and the 0A mid-term review as the internal milestone.
