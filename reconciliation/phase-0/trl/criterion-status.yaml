# Status of each gate criterion in round-1/gates-proposal.yaml, for the site and explorer.
# A criterion can carry several of:
#   decided:  accepted owner decisions (decisions.md) or confirmed gate rulings (gate-rulings.yaml)
#   interim:  proposed decisions used as interim positions (D-03 … D-05)
#   pending:  owner rulings still open, with the evidence questions that inform them
#             (sheet items refer to gate-rulings-sheet.md Part 2)
#   panel:    a model disagreement nobody has raised as a question yet
# Criteria not listed are agreed by the panel as written.
# Updated 2026-10-20.

criteria:
  kdp-0a-evidence:
    panel: Whether panel agreement can stand in for test evidence at KDP-0A
  kdp-0a-reclassify:
