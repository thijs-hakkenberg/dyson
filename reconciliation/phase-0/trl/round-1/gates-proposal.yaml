      Continue toward KDP-0B. Claude: freeze pathfinder payload; narrow metallurgy to <= 2 routes. Gemini: down-select
      metallurgy route. GPT: fund qualified tranches only; update schedule with remaining AD2.
    fail: >-
      Claude: one funded re-plan with KDP-0B slip inside sunset; second fail stops 0B spend (0A only, Earth supply).
      Gemini: restructure ground R&D; delay pathfinder. GPT: stop or withhold failed routes; bounded corrective
      programme, or complete 0A without production.
  - id: g-target
    name: Target gate — sampled recoverable Fe-Ni
    type: discriminating
    month:
      min: 48
      max: 180
    proposed_by:
      - Claude
      - Gemini
      - GPT
    disputed: true
    purpose: Confirm an accessible sampled target whose recoverable Fe-Ni supports the 0B plan.
    criteria:
      - id: target-grade
        description: Sampled recoverable Fe-Ni grade
        metric: >-
          Claude: lower 90% CB of kg product per kg ore after beneficiation, from excavation-depth samples. Gemini:
          Fe-Ni mass fraction. GPT: confidence-bounded recoverable grade and inventory after measured beneficiation and
          recovery.
        threshold: >-
          Claude: >= KDP-0B base-case yield set by rq-0-61 via rq-0-51 (architecture implies ~4-5%; corner range
          1.3-16%), primary and backup. Gemini: set by rq-0-50. GPT: set by rq-0-50/51 before final commitment; at least
          one sampled primary.
        technologies:
          - T04
          - T05
          - T16
          - T18
        trl_required: null
        evidence_from:
          - rq-0-50
          - rq-0-51
          - rq-0-61
        proposed_by:
          - Claude
          - Gemini
          - GPT
        disputed: true
      - id: target-geotech
        description: Physical/geotechnical characterisation
        metric: Shape, spin, cohesion, boulder distribution (Claude); geotechnical properties and spatial variability (GPT)
        threshold: Sufficient to close T04/T16 design loads
        technologies:
          - T04
          - T16
        trl_required: null
        evidence_from:
          - rq-0-50
        proposed_by:
          - Claude
          - GPT
      - id: target-transport
        description: Transport feasibility to SEL1
        metric: Round-trip delta-v, windows, power history and cycle cadence within tug envelope
        threshold: >-
          Claude: within envelope (1.5-5 yr round trip) for primary and backup. GPT: close 150-300 t payload and 1.5-5
          yr cycle, or approve resized architecture before KDP-0B.
        technologies:
          - T01
          - T02
          - T14
          - T25
        trl_required: null
        evidence_from:
          - rq-0-52
          - rq-0-59
        proposed_by:
          - Claude
          - GPT
        disputed: true
      - id: target-scout-trl
        description: Scout and sampling systems mature enough to produce target evidence
        metric: TRL assessment
        threshold: TRL 7 (Gemini; contrast Claude TRL 6 at PDR, GPT TRL 8 before launch)
        technologies:
          - T11
          - T18
        trl_required: 7
        evidence_from:
          - rq-0-50
        proposed_by:
          - Gemini
        disputed: true
    pass: Baseline primary (and, per Claude, backup) target; fix yield in the delivered-cost model.
    fail: >-
      Claude: one further scout wave (<= 36 months, inside sunset), then 0A only, Earth supply. Gemini: 0A only, Earth
      supply. GPT: resample or change target within a prospecting cap, then 0A only, Earth supply.
  - id: g-demand
    name: Demand gate — signed Phase 1 schedule
    type: discriminating
    month:
      min: 48
      max: 180
    proposed_by:
      - Claude
      - Gemini
      - GPT
    disputed: true
    purpose: Size 0B to binding Phase 1 demand rather than projections.
    criteria:
      - id: demand-3x
        description: Signed Phase 1 demand satisfies the D-02 within-3x condition
        metric: >-
          Claude and Gemini: ratio of signed annual demand (kt/yr) to planned 0B output. GPT: interpretation unresolved;
          proposes accepted delivery-date span <= 3x elapsed time from a common 0A epoch.
        threshold: >-
          Claude: signed demand >= one third of nameplate (~0.2-0.8 kt/yr) with schedule overlap. Gemini: set by
          rq-0-58. GPT: set by rq-0-58 once 3x is defined; not objectively passable until then.
        technologies: []
        trl_required: null
        evidence_from:
          - rq-0-58
        proposed_by:
          - Claude
          - Gemini
          - GPT
        disputed: true
      - id: demand-signed-definition
        description: Definition of signed demand
        metric: Owner definition recorded
        threshold: >-
          Claude: funded Phase 1 baseline line item at Phase 1's own KDP, or external offtaker; flags circularity. GPT:
          signed specification, quantities, delivery node and dated schedule.
        technologies: []
        trl_required: null
        evidence_from:
          - rq-0-58
          - D-02
        proposed_by:
          - Claude
          - GPT
        disputed: true
      - id: demand-spec
        description: Product specification agreed
        metric: Signed specification (composition, form, tolerances)
        threshold: Exists and is testable by T22 qualification
        technologies:
          - T22
        trl_required: null
        evidence_from:
          - rq-0-58
        proposed_by:
          - Claude
          - GPT
    pass: Demand sets the maximum justified 0B scale; do not size above accepted demand (GPT).
    fail: >-
      Claude: defer 0B at minimal option-keeping spend; re-test at Phase 1 milestones. Gemini: 0A only, Earth supply.
      GPT: reduce or defer 0B; absent adequate demand, 0A only, Earth supply.
  - id: g-economics
    name: Economics gate — delivered cost vs Earth supply
    type: discriminating
    month:
      min: 60
      max: 180
    proposed_by:
      - Claude
      - Gemini
      - GPT
    disputed: true
    purpose: Compare fully burdened delivered Fe-Ni at SEL1 with equivalent Earth supply.
    criteria:
      - id: eco-ratio
        description: Delivered cost on a common basis (capital, reagents and spares, propellant, operations, delay)
        metric: 0B $/kg at SEL1 against Earth-supply $/kg at SEL1
        threshold: >-
          Claude: 0B P70 <= R x Earth P50, R set by owner (may exceed 1 per D-01), numbers via rq-0-61. Gemini: must
          undercut Earth supply. GPT: expected cost no higher than Earth supply plus owner downside bound; any
          capability subsidy is a separate owner decision.
        technologies:
          - T01
          - T05
          - T14
          - T22
        trl_required: null
        evidence_from:
          - rq-0-61
          - rq-0-57
          - rq-0-53
          - rq-0-52
          - rq-0-28
          - rq-0-56
        proposed_by:
          - Claude
          - Gemini
          - GPT
        disputed: true
      - id: eco-robustness
        description: Decision robustness
        metric: >-
          Claude: sign of (ratio - R) across launch-price and yield ranges. GPT: downside exposure and sensitivity to
          grade, utilisation, replacement and delay.
        threshold: Does not reverse across stated ranges (Claude)
        technologies: []
        trl_required: null
        evidence_from:
          - rq-0-61
          - rq-0-57
          - rq-0-50
        proposed_by:
          - Claude
          - GPT
      - id: eco-confidence
        description: Cost estimate confidence
        metric: Estimate uncertainty band
        threshold: +/- 30% or better
        technologies: []
        trl_required: null
        evidence_from:
          - rq-0-28
          - rq-0-57
        proposed_by:
          - Claude
    pass: Economic condition for 0B satisfied.
    fail: >-
      All: Earth supply. Claude: re-test on pre-set shifts in launch price or demand. GPT: subsidy only by new explicit
      owner decision.
  - id: g-licence
    name: Licence gate — debris, tailings and operating envelope
    type: discriminating
    month:
      min: 48
      max: 180
    proposed_by:
      - Claude
      - Gemini
      - GPT
    disputed: true
    purpose: Obtain licensing-state authorisation with a numeric escape limit the system is shown to meet.
    criteria:
      - id: licence-limit
        description: >-
          Written authorisation (Claude cites OST Article VI) with escape limit, verification method and tailings
          requirement for 13-47 kt/yr
        metric: >-
          Approved escaped-mass limit per site (GPT adds particle/velocity classes, confidence, averaging interval,
          abnormal-event limits)
        threshold: >-
          Gemini: <= 1 t/yr. Claude: interim <= 1 t/yr ALARP; final set by rq-0-41. GPT: <= 1 t/yr is interim only, not
          a licence; binding value from rq-0-41 and the licensing state.
        technologies:
          - T08
        trl_required: null
        evidence_from:
          - rq-0-41
          - D-03
        proposed_by:
          - Claude
          - Gemini
          - GPT
        disputed: true
      - id: licence-verification
        description: Containment and escape verification demonstrated
        metric: >-
          Claude: measured pathfinder escape vs limit and detection limit. GPT: uncertainty-bounded annualised escape
          incl. excavation, transfers, storage and credible failures. Gemini: escaped t/yr.
        threshold: >-
          Claude: below limit; detection limit <= 10% of limit. GPT: compliant with uncertainty included. Gemini: <= 1
          t/yr.
        technologies:
          - T04
          - T08
          - T19
        trl_required: 6
        evidence_from:
          - rq-0-41
          - pathfinder
          - containment tests
        proposed_by:
          - Claude
          - Gemini
          - GPT
        disputed: true
      - id: licence-frequency
        description: Frequency coordination for 15-29 assets
        metric: National filing and ITU coordination status
        threshold: Coordinated
        technologies:
          - T26
        trl_required: null
        evidence_from:
          - rq-0-64
        proposed_by:
          - Claude
    pass: Licensed operating envelope accepted for production.
    fail: >-
      Claude: no waiver; no 0B production; 0A only. Gemini: 0A only, Earth supply. GPT: redesign and reapply within a
      bounded extension, or prohibit 0B and retain Earth supply.
