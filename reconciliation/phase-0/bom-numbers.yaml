# Phase 0 BOM quantities and costs, taken from the regenerated consensus (2026-10-20, panel
# Claude Opus 5.5 / Gemini 3.1 Pro / GPT-6.1 Sol, synthesis by Claude Opus 5.5).
#
# Structure (which items exist, 0A/0B split) is the owner decision in bom-structure.yaml. The
# numbers below are transcribed from each item's consensus.md "Recommended Approach"; `source`
# names the step. Rules:
#   - Costs are 2026 USD, launch excluded unless the item is launch (bom-0-8), contingency
#     excluded (it is bom-0-17, computed from the rates below).
#   - `a` = Phase 0A (committed), `b` = Phase 0B (gated option, D-01). [min, max] is the envelope.
#   - `point` is the consensus planning value where it states one; otherwise none is invented
#     and scripts/build-bom-data.js uses the midpoint, marked as such on the site.
#   - `conditional` items are 0 at the low end (bom-0-6 flies only for a C-type target).
#   - `derived` blocks are arithmetic on figures the consensus states, not new estimates.
#   - `per_unit: false` marks a quantity that is a sizing figure (hours, FTE, tonnes a year), not
#     a count of the thing being bought, so no unit cost is shown.
# Divergent model positions stay in each item's divergent-views.yaml; this file holds only the
# consensus envelope.
